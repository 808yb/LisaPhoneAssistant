    <title>Autohaus Kaiserslautern - KI-Telefonempfang</title>
    <script>
      // Safeguard for window.fetch assignment in browser environments
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch || originalFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            }
          });
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
